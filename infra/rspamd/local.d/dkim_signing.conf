# Per-domain DKIM signing. Keys are generated on the server by the deploy
# script into /var/lib/rspamd/dkim/<domain>.<selector>.key with mode 0640
# root:_rspamd. The `path` template lets Rspamd resolve the key by domain+selector.

selector    = "cm1"
path        = "/var/lib/rspamd/dkim/$domain.$selector.key";
allow_hdrfrom_mismatch     = true;
allow_hdrfrom_mismatch_sign_networks = true;
allow_username_mismatch    = true;
use_domain                 = "header";
sign_local                 = true;
try_fallback               = true;
