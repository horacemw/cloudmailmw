# Per-domain DKIM signing. Keys are generated on the server by the deploy
# script into /var/lib/rspamd/dkim/<domain>.<selector>.key with mode 0640
# root:_rspamd. The `path` template lets Rspamd resolve the key by domain+selector.

selector    = "cm1"
path        = "/var/lib/rspamd/dkim/$domain.$selector.key";
allow_hdrfrom_mismatch     = true;
allow_hdrfrom_mismatch_sign_networks = true;
allow_username_mismatch    = true;
use_domain                 = "header";
# Sign for the full From-header FQDN (e.g. mail.digiskills.live), not the
# organisational domain (digiskills.live). Verified 2026-09-22: with the
# default use_esld=true, Rspamd tried to load digiskills.live.cm1.key when
# signing mail from no-reply@mail.digiskills.live and skipped signing when
# the file wasn't there. The apps/api DKIM keygen names files by the full
# domain, and DNS records live under cm1._domainkey.<full-domain>, so this
# must be false for signing to work per-subdomain.
use_esld                   = false;
sign_local                 = true;
try_fallback               = true;
