# Optional ClamAV integration via Rspamd's antivirus module.
# Requires `clamav-daemon` running with local socket /var/run/clamav/clamd.ctl.

clamav {
  attachments_only = false;
  symbol           = "CLAM_VIRUS";
  type             = "clamav";
  action           = "reject";
  servers          = "/var/run/clamav/clamd.ctl";
  scan_mime_parts  = true;
  scan_text_mime   = false;
  scan_image_mime  = false;
}
