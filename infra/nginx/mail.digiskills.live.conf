# ─── Cloud Mail — nginx site for mail.digiskills.live ───────────────
# Deployed to /etc/nginx/sites-available/mail.digiskills.live and
# symlinked into sites-enabled. Serves:
#   - the Vite-built web app (/) → apps/web/dist
#   - the Fastify API           (/v1/) → 127.0.0.1:4000
#   - Thunderbird autoconfig    (/mail/config-v1.1.xml)

server {
  listen 80;
  listen [::]:80;
  server_name mail.digiskills.live;
  # Everything else redirects to HTTPS. ACME challenge stays plaintext.
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name mail.digiskills.live;

  ssl_certificate     /etc/letsencrypt/live/mail.digiskills.live/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mail.digiskills.live/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_session_cache shared:CloudMailTLS:10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Content-Security-Policy. Purpose: (a) hard XSS defence-in-depth for the
  # webmail — HTML email bodies are already sanitised in JS, but a CSP means
  # even a sanitiser bug can't ex-fil to a hostile origin; (b) signal to
  # browsers (Chrome Safe Browsing) that this new domain treats security
  # seriously, reducing conservative "password entered on unfamiliar site"
  # warnings that a brand-new hostname otherwise attracts.
  #
  # 'unsafe-inline' on style-src is required because React inline `style={{…}}`
  # attributes and lucide-react SVGs use inline styles at render time. No
  # 'unsafe-inline' or 'unsafe-eval' on script-src — the Vite bundle is
  # entirely self-hosted at /assets/*.js. img-src allows data: (MFA QR PNG,
  # base64 avatars), blob: (URL.createObjectURL avatar preview), and https:
  # (remote images embedded in incoming email HTML — kept broad so the
  # ReadingPane doesn't visibly break; can be tightened once a "remote images
  # off by default" UX ships). connect-src is 'self' because the API is
  # same-origin behind nginx.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self'; frame-src 'none'; media-src 'self'" always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  # Frontend (static SPA)
  root /opt/cloudmail/current/apps/web/dist;
  index index.html;
  location / {
    try_files $uri /index.html;
    expires -1;
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # API
  location /v1/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  # Thunderbird autoconfig
  location = /mail/config-v1.1.xml {
    default_type application/xml;
    alias /opt/cloudmail/current/infra/nginx/thunderbird-autoconfig.xml;
  }

  # Uploads and body size cap
  client_max_body_size 40m;
}
