# ─── Cloud Mail — Dovecot main config ───────────────────────────────
# Loaded from /etc/dovecot/dovecot.conf. All other config lives in
# /etc/dovecot/conf.d/*.conf but for simplicity we inline the important
# settings here so the intent is visible in one place.

protocols = imap lmtp sieve
listen = *, ::
log_path = syslog
info_log_path = syslog

# ─── Mail storage: Maildir per virtual user ──────────────────────────
mail_home     = /var/vmail/%d/%n
mail_location = maildir:~/Maildir:LAYOUT=fs
mail_uid      = vmail
mail_gid      = vmail
first_valid_uid = 5000
last_valid_uid  = 5000

# ─── Namespaces: system folders + special-use flags ──────────────────
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts { special_use = \Drafts; auto = subscribe; }
  mailbox Sent   { special_use = \Sent;   auto = subscribe; }
  mailbox Trash  { special_use = \Trash;  auto = subscribe; }
  mailbox Spam   { special_use = \Junk;   auto = subscribe; autoexpunge = 30 days; }
  mailbox Archive{ special_use = \Archive; auto = no; }
}

# ─── Authentication ──────────────────────────────────────────────────
disable_plaintext_auth = yes
auth_mechanisms       = plain login
auth_master_user_separator = *

passdb {
  driver = sql
  args   = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = static
  args   = uid=vmail gid=vmail home=/var/vmail/%d/%n
}

# Master passdb — used by the Cloud Mail API to log in as any user with the
# master secret. The mailbox owner's own password STILL works normally.
passdb {
  driver = passwd-file
  master = yes
  args   = /etc/dovecot/master-users
}

# ─── Services ────────────────────────────────────────────────────────
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service imap-login {
  inet_listener imap  { port = 143; }
  inet_listener imaps { port = 993; ssl = yes; }
}
service imap {
  process_limit = 512
}

# ─── TLS ─────────────────────────────────────────────────────────────
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </etc/letsencrypt/live/mail.digiskills.live/fullchain.pem
ssl_key  = </etc/letsencrypt/live/mail.digiskills.live/privkey.pem

# ─── Quotas from Postgres (per-mailbox) ──────────────────────────────
plugin {
  quota = maildir:User quota
  quota_status_success = DUNNO
  quota_status_nouser  = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
}
protocol lmtp {
  mail_plugins = $mail_plugins quota sieve
  postmaster_address = postmaster@mail.digiskills.live
}
protocol imap {
  mail_plugins = $mail_plugins quota imap_quota
}

# ─── Sieve (server-side rules — spam handling, filters) ─────────────
service managesieve-login {
  inet_listener sieve { port = 4190; }
}
plugin {
  sieve = /var/vmail/%d/%n/.dovecot.sieve
  sieve_dir = /var/vmail/%d/%n/sieve
  sieve_after = /etc/dovecot/sieve-after
}
